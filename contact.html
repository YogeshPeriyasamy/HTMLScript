<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Y-Creation Agency | Contact</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav id="navbar">
      <h1 class="logo">
        <a href="index.html">Y-Creation Agency</a>
      </h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="contact.html" class="current">Contact</a></li>
      </ul>
    </nav>

    <!--  Header -->
    <header id="page-header">
      <div class="container">
        <h1>Contact Us</h1>
        <p>Let's talk about your project</p>
      </div>
    </header>

    <!-- Contact Section -->
    <section id="contact">
      <div class="container">
        <div class="contact-grid">

          <!-- Contact Form -->
          <div>
            <h2>Send Us A Message</h2>
            <form>
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter Name" />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email" />
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter Phone" />
              </div>
              <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Enter Message"></textarea>
              </div>
              <button type="submit" class="btn">Submit</button>
            </form>
          </div>

          <!-- Contact Info -->
          <div>
            <h2>Contact Info</h2>
            <ul class="contact-info">
              <li><i class="fas fa-map-marker"></i> HSR layout, Bangalore, KA</li>
              <li><i class="fas fa-phone"></i> (91)5555555555</li>
              <li><i class="fas fa-envelope"></i> hello@y-creationagency.com</li>
            </ul>
          </div>

        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer id="main-footer">
      <p>Y-Creation Agency &copy; 2026</p>
    </footer>
  </body>
</html>
